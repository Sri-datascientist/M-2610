# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = databases/migrations

# template used to generate migration file names
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# timezone =

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a source .py file to be detected
# sourceless = false

# version location specification
version_locations = %(here)s/database/migrations/versions

# version path separator
version_path_separator = os

# set to 'true' to search source files recursively in each "version_locations" directory
recursive_version_locations = false

# database URL is dynamically overridden in env.py from app.config.settings.DATABASE_URL
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/meyveda_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
